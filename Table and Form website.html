<html>
<head>
<title> Table and forms </title>
</head>
<body>
<h2 align =center> College Application Form </h2>
<form>
<table border =5 align =center>
<tr>
<td> Name of the Student </td>
<td><input type= text></td>
</tr>
<tr>
<td> ID to be created </td>
<td><input type = text></td>
</tr>
<tr>
<td> Password </td>
<td><input type = password></td>
</tr>
<tr>
<td> Gender </td>
<td><input type = "radio" NAME = "GENDER" VALUE="MALE"> MALE
<input type = "radio" NAME = "GENDER" VALUE = "FEMALE"> FEMALE </td>
</tr>
<tr>
<td> Student's Address </td>
<td><textarea rows=5 cols=25> Enter address here..... </textarea></td>
</tr>
<tr>
<td> Course Opted for </td>
<td><select name = "dropdown">
<option> None </option>
<option> Science </option>
<option> Commerce</option>
</select>
</td>
</tr>
<tr>
<td> Subjects Selected </td>
<td><input type = checkbox > Accountancy
<input type = checkbox > Business Studies
<input type = checkbox > Economics
<input type = checkbox > Physics
<input type = checkbox > Chemistry
<input type = checkbox > Maths
</td>
</tr>
</table>
</form>
<br>
<br>
<center><input type = "button" value = "SUBMIT" >
<input type = "button" value = "RESET" >
</center>
</body>
</html>
